<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="380" viewBox="0 0 400 380">
  <defs>
    <marker id="arrowRight" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#333"/>
    </marker>
    <marker id="arrowBoth" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,3 L4,0 L4,6 z M10,3 L6,0 L6,6 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Main component box -->
  <rect x="100" y="50" width="200" height="280" fill="#f5f5f5" stroke="#333" stroke-width="2" rx="3" ry="3"/>

  <!-- Title -->
  <text x="200" y="85" font-family="SansSerif, Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Block Storage</text>

  <!-- Internal registers display area -->
  <rect x="115" y="100" width="170" height="90" fill="#e8e8e8" stroke="#999" stroke-width="1" rx="2" ry="2"/>
  <text x="200" y="118" font-family="monospace" font-size="10" text-anchor="middle" fill="#666">Registers</text>

  <!-- Register labels -->
  <text x="130" y="140" font-family="monospace" font-size="9" fill="#333">Command</text>
  <rect x="130" y="145" width="60" height="16" fill="#fff" stroke="#999" stroke-width="1"/>

  <text x="210" y="140" font-family="monospace" font-size="9" fill="#333">Status</text>
  <rect x="210" y="145" width="60" height="16" fill="#fff" stroke="#999" stroke-width="1"/>

  <text x="130" y="175" font-family="monospace" font-size="9" fill="#333">Mem Addr</text>
  <rect x="130" y="180" width="60" height="16" fill="#fff" stroke="#999" stroke-width="1"/>

  <text x="210" y="175" font-family="monospace" font-size="9" fill="#333">Block Addr</text>
  <rect x="210" y="180" width="60" height="16" fill="#fff" stroke="#999" stroke-width="1"/>

  <!-- File status area -->
  <rect x="115" y="205" width="170" height="40" fill="#e0ffe0" stroke="#999" stroke-width="1" rx="2" ry="2"/>
  <text x="200" y="222" font-family="SansSerif, Arial" font-size="10" text-anchor="middle" fill="#333">block_storage.bin</text>
  <text x="200" y="238" font-family="SansSerif, Arial" font-size="9" text-anchor="middle" fill="#666">(file status)</text>

  <!-- LEFT SIDE PORTS -->

  <!-- ADDR (3-bit input) -->
  <line x1="50" y1="100" x2="100" y2="100" stroke="#333" stroke-width="2"/>
  <text x="45" y="104" font-family="monospace" font-size="11" text-anchor="end" fill="#333">ADDR[2:0]</text>
  <polygon points="100,100 93,96 93,104" fill="#333"/>

  <!-- READ_ENABLE (1-bit input) -->
  <line x1="50" y1="120" x2="100" y2="120" stroke="#333" stroke-width="1.5"/>
  <text x="45" y="124" font-family="monospace" font-size="11" text-anchor="end" fill="#333">RD_EN</text>
  <polygon points="100,120 93,116 93,124" fill="#333"/>

  <!-- WRITE_ENABLE (1-bit input) -->
  <line x1="50" y1="140" x2="100" y2="140" stroke="#333" stroke-width="1.5"/>
  <text x="45" y="144" font-family="monospace" font-size="11" text-anchor="end" fill="#333">WR_EN</text>
  <polygon points="100,140 93,136 93,144" fill="#333"/>

  <!-- BE3 (bidirectional) -->
  <line x1="50" y1="190" x2="100" y2="190" stroke="#0066cc" stroke-width="1.5"/>
  <text x="45" y="194" font-family="monospace" font-size="11" text-anchor="end" fill="#0066cc">BE3</text>
  <polygon points="100,190 93,186 93,194" fill="#0066cc"/>
  <polygon points="50,190 57,186 57,194" fill="#0066cc"/>

  <!-- BE2 (bidirectional) -->
  <line x1="50" y1="200" x2="100" y2="200" stroke="#0066cc" stroke-width="1.5"/>
  <text x="45" y="204" font-family="monospace" font-size="11" text-anchor="end" fill="#0066cc">BE2</text>
  <polygon points="100,200 93,196 93,204" fill="#0066cc"/>
  <polygon points="50,200 57,196 57,204" fill="#0066cc"/>

  <!-- BE1 (bidirectional) -->
  <line x1="50" y1="210" x2="100" y2="210" stroke="#0066cc" stroke-width="1.5"/>
  <text x="45" y="214" font-family="monospace" font-size="11" text-anchor="end" fill="#0066cc">BE1</text>
  <polygon points="100,210 93,206 93,214" fill="#0066cc"/>
  <polygon points="50,210 57,206 57,214" fill="#0066cc"/>

  <!-- BE0 (bidirectional) -->
  <line x1="50" y1="220" x2="100" y2="220" stroke="#0066cc" stroke-width="1.5"/>
  <text x="45" y="224" font-family="monospace" font-size="11" text-anchor="end" fill="#0066cc">BE0</text>
  <polygon points="100,220 93,216 93,224" fill="#0066cc"/>
  <polygon points="50,220 57,216 57,224" fill="#0066cc"/>

  <!-- RESET (1-bit input) -->
  <line x1="50" y1="240" x2="100" y2="240" stroke="#cc0000" stroke-width="1.5"/>
  <text x="45" y="244" font-family="monospace" font-size="11" text-anchor="end" fill="#cc0000">RESET</text>
  <polygon points="100,240 93,236 93,244" fill="#cc0000"/>

  <!-- BUS_ACK (1-bit input) -->
  <line x1="50" y1="280" x2="100" y2="280" stroke="#333" stroke-width="1.5"/>
  <text x="45" y="284" font-family="monospace" font-size="11" text-anchor="end" fill="#333">BUS_ACK</text>
  <polygon points="100,280 93,276 93,284" fill="#333"/>

  <!-- CLOCK (1-bit input) -->
  <line x1="50" y1="300" x2="100" y2="300" stroke="#333" stroke-width="1.5"/>
  <text x="45" y="304" font-family="monospace" font-size="11" text-anchor="end" fill="#333">CLK</text>
  <polygon points="100,300 93,296 93,304" fill="#333"/>
  <!-- Clock symbol (triangle) -->
  <polygon points="100,295 100,305 110,300" fill="none" stroke="#333" stroke-width="1"/>

  <!-- RIGHT SIDE PORTS -->

  <!-- DATA (32-bit bidirectional) -->
  <line x1="300" y1="100" x2="350" y2="100" stroke="#0066cc" stroke-width="3"/>
  <text x="355" y="104" font-family="monospace" font-size="11" text-anchor="start" fill="#0066cc">DATA[31:0]</text>
  <polygon points="300,100 307,96 307,104" fill="#0066cc"/>
  <polygon points="350,100 343,96 343,104" fill="#0066cc"/>

  <!-- MEM_READ (1-bit output) -->
  <line x1="300" y1="200" x2="350" y2="200" stroke="#009900" stroke-width="1.5"/>
  <text x="355" y="204" font-family="monospace" font-size="11" text-anchor="start" fill="#009900">MEM_RD</text>
  <polygon points="350,200 343,196 343,204" fill="#009900"/>

  <!-- MEM_WRITE (1-bit output) -->
  <line x1="300" y1="220" x2="350" y2="220" stroke="#009900" stroke-width="1.5"/>
  <text x="355" y="224" font-family="monospace" font-size="11" text-anchor="start" fill="#009900">MEM_WR</text>
  <polygon points="350,220 343,216 343,224" fill="#009900"/>

  <!-- DMA_ADDR (32-bit output) -->
  <line x1="300" y1="240" x2="350" y2="240" stroke="#009900" stroke-width="3"/>
  <text x="355" y="244" font-family="monospace" font-size="11" text-anchor="start" fill="#009900">DMA_ADDR[31:0]</text>
  <polygon points="350,240 343,236 343,244" fill="#009900"/>

  <!-- BUS_REQUEST (1-bit output) -->
  <line x1="300" y1="260" x2="350" y2="260" stroke="#009900" stroke-width="1.5"/>
  <text x="355" y="264" font-family="monospace" font-size="11" text-anchor="start" fill="#009900">BUS_REQ</text>
  <polygon points="350,260 343,256 343,264" fill="#009900"/>

  <!-- Legend -->
  <rect x="100" y="335" width="200" height="40" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" ry="3"/>
  <text x="200" y="350" font-family="SansSerif, Arial" font-size="10" text-anchor="middle" fill="#666">Legend:</text>
  <line x1="120" y1="362" x2="140" y2="362" stroke="#333" stroke-width="1.5"/>
  <polygon points="140,362 133,358 133,366" fill="#333"/>
  <text x="145" y="366" font-family="SansSerif, Arial" font-size="9" fill="#333">Input</text>

  <line x1="175" y1="362" x2="195" y2="362" stroke="#009900" stroke-width="1.5"/>
  <polygon points="195,362 188,358 188,366" fill="#009900"/>
  <text x="200" y="366" font-family="SansSerif, Arial" font-size="9" fill="#009900">Output</text>

  <line x1="235" y1="362" x2="255" y2="362" stroke="#0066cc" stroke-width="1.5"/>
  <polygon points="255,362 248,358 248,366" fill="#0066cc"/>
  <polygon points="235,362 242,358 242,366" fill="#0066cc"/>
  <text x="260" y="366" font-family="SansSerif, Arial" font-size="9" fill="#0066cc">Bidir</text>
</svg>
