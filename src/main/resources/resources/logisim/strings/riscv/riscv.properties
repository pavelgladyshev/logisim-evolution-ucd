#
# riscv/Timer.java
#
timerAddress = Address: the mtimecmp Address or the mtime Address selects that register's low word, and the address 4 above it the register's high word
timerReadEnable = Read Enable: while 1, Data Out is the selected word
timerWriteEnable = Write Enable: when 1 at a rising clock edge, the selected word takes Data In
timerDataIn = Data In: the word that is written
timerDataOut = Data Out: the selected word of mtimecmp or mtime while Read Enable is 1, and 0 otherwise
timerInterruptRequestOut = Interrupt Request Out: 1 while mtime >= mtimecmp, both of 64 bits and unsigned
timerReset = Reset: while 1, mtime is 0 and mtimecmp %s, as when the simulation starts
timerClock = Clock: at each rising edge mtime, of 64 bits, counts on by one
timerMtimeAddr = mtime Address
timerMtimecmpAddr = mtimecmp Address
timerHexRegisters = Hex Registers?

