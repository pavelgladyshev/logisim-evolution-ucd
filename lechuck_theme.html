<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeChuck's Theme - Monkey Island</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(180deg, #0a0a1a 0%, #1a0a2e 50%, #2d1b4e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', serif;
            color: #e0d5c0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
            position: relative;
            z-index: 10;
        }
        h1 {
            font-size: 3em;
            color: #ff6b35;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.5), 2px 2px 4px #000;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        h2 {
            font-size: 1.5em;
            color: #8b7355;
            margin-bottom: 40px;
            font-style: italic;
        }
        .play-btn {
            background: linear-gradient(180deg, #8b0000 0%, #4a0000 100%);
            border: 3px solid #ff6b35;
            color: #fff;
            padding: 20px 60px;
            font-size: 1.5em;
            cursor: pointer;
            border-radius: 10px;
            font-family: 'Georgia', serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.5), inset 0 0 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .play-btn:hover {
            background: linear-gradient(180deg, #a00000 0%, #5a0000 100%);
            box-shadow: 0 0 50px rgba(255, 107, 53, 0.7);
            transform: scale(1.05);
        }
        .play-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .play-btn.playing {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(139, 0, 0, 0.5); }
            50% { box-shadow: 0 0 60px rgba(255, 107, 53, 0.8); }
        }
        .skull {
            font-size: 80px;
            margin: 30px 0;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .flames {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: linear-gradient(0deg, rgba(255,69,0,0.3) 0%, transparent 100%);
            pointer-events: none;
        }
        .note-display {
            margin-top: 30px;
            font-size: 1.2em;
            color: #ff9966;
            min-height: 30px;
        }
        .ghost-ship {
            position: fixed;
            bottom: 50px;
            opacity: 0.1;
            font-size: 100px;
            animation: sail 20s linear infinite;
        }
        @keyframes sail {
            0% { left: -100px; }
            100% { left: calc(100% + 100px); }
        }
        .credits {
            margin-top: 40px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="ghost-ship">⛵</div>
    <div class="container">
        <h1>☠️ LeChuck's Theme ☠️</h1>
        <h2>The Secret of Monkey Island</h2>
        <div class="skull">💀</div>
        <button class="play-btn" id="playBtn">▶ Play Theme</button>
        <div class="note-display" id="noteDisplay"></div>
        <div class="credits">
            <p>Original composition by Michael Land</p>
            <p>Recreation for educational purposes</p>
        </div>
    </div>
    <div class="flames"></div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const noteDisplay = document.getElementById('noteDisplay');
        let isPlaying = false;
        let synths = [];

        // LeChuck's Theme - ominous pirate melody
        // Based on the iconic theme from Monkey Island

        async function playLeChuckTheme() {
            await Tone.start();

            // Clear any existing synths
            synths.forEach(s => s.dispose());
            synths = [];

            // Create instruments
            const bassSynth = new Tone.MonoSynth({
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.02, decay: 0.3, sustain: 0.4, release: 0.8 },
                filterEnvelope: { attack: 0.02, decay: 0.2, sustain: 0.5, release: 0.8, baseFrequency: 100, octaves: 3 }
            }).toDestination();
            bassSynth.volume.value = -8;
            synths.push(bassSynth);

            const leadSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.02, decay: 0.3, sustain: 0.3, release: 0.5 }
            }).toDestination();
            leadSynth.volume.value = -6;
            synths.push(leadSynth);

            const organSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.1, decay: 0.5, sustain: 0.6, release: 1 }
            }).toDestination();
            organSynth.volume.value = -12;
            synths.push(organSynth);

            // Ominous pad
            const padSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.5, decay: 1, sustain: 0.8, release: 2 }
            }).toDestination();
            padSynth.volume.value = -18;
            synths.push(padSynth);

            Tone.Transport.bpm.value = 100;

            // LeChuck's Theme - Main melody (D minor, ominous and menacing)
            const melodyNotes = [
                // Intro - ominous ascending
                { time: "0:0", note: "D3", duration: "4n" },
                { time: "0:1", note: "F3", duration: "4n" },
                { time: "0:2", note: "A3", duration: "4n" },
                { time: "0:3", note: "D4", duration: "4n" },

                // Main theme - menacing melody
                { time: "1:0", note: "D4", duration: "8n" },
                { time: "1:0:2", note: "E4", duration: "8n" },
                { time: "1:1", note: "F4", duration: "4n" },
                { time: "1:2", note: "E4", duration: "8n" },
                { time: "1:2:2", note: "D4", duration: "8n" },
                { time: "1:3", note: "C#4", duration: "4n" },

                { time: "2:0", note: "D4", duration: "8n" },
                { time: "2:0:2", note: "E4", duration: "8n" },
                { time: "2:1", note: "F4", duration: "8n" },
                { time: "2:1:2", note: "G4", duration: "8n" },
                { time: "2:2", note: "A4", duration: "2n" },

                // Descending ominous phrase
                { time: "3:0", note: "A4", duration: "8n" },
                { time: "3:0:2", note: "G4", duration: "8n" },
                { time: "3:1", note: "F4", duration: "8n" },
                { time: "3:1:2", note: "E4", duration: "8n" },
                { time: "3:2", note: "D4", duration: "4n" },
                { time: "3:3", note: "C#4", duration: "4n" },

                { time: "4:0", note: "D4", duration: "2n." },

                // Second phrase - more intense
                { time: "5:0", note: "A4", duration: "8n" },
                { time: "5:0:2", note: "Bb4", duration: "8n" },
                { time: "5:1", note: "A4", duration: "4n" },
                { time: "5:2", note: "G4", duration: "8n" },
                { time: "5:2:2", note: "F4", duration: "8n" },
                { time: "5:3", note: "E4", duration: "4n" },

                { time: "6:0", note: "F4", duration: "8n" },
                { time: "6:0:2", note: "G4", duration: "8n" },
                { time: "6:1", note: "A4", duration: "4n" },
                { time: "6:2", note: "D5", duration: "2n" },

                // Climax
                { time: "7:0", note: "D5", duration: "8n" },
                { time: "7:0:2", note: "C5", duration: "8n" },
                { time: "7:1", note: "Bb4", duration: "8n" },
                { time: "7:1:2", note: "A4", duration: "8n" },
                { time: "7:2", note: "G4", duration: "8n" },
                { time: "7:2:2", note: "F4", duration: "8n" },
                { time: "7:3", note: "E4", duration: "8n" },
                { time: "7:3:2", note: "D4", duration: "8n" },

                // Final resolution
                { time: "8:0", note: "D4", duration: "1n" },
            ];

            // Bass line - deep and menacing
            const bassNotes = [
                { time: "0:0", note: "D2", duration: "1n" },
                { time: "1:0", note: "D2", duration: "2n" },
                { time: "1:2", note: "A1", duration: "2n" },
                { time: "2:0", note: "D2", duration: "2n" },
                { time: "2:2", note: "F2", duration: "2n" },
                { time: "3:0", note: "G2", duration: "2n" },
                { time: "3:2", note: "A2", duration: "2n" },
                { time: "4:0", note: "D2", duration: "1n" },
                { time: "5:0", note: "D2", duration: "2n" },
                { time: "5:2", note: "C2", duration: "2n" },
                { time: "6:0", note: "Bb1", duration: "2n" },
                { time: "6:2", note: "A1", duration: "2n" },
                { time: "7:0", note: "G2", duration: "2n" },
                { time: "7:2", note: "A2", duration: "2n" },
                { time: "8:0", note: "D2", duration: "1n" },
            ];

            // Organ chords - eerie atmosphere
            const organChords = [
                { time: "0:0", notes: ["D3", "F3", "A3"], duration: "1n" },
                { time: "1:0", notes: ["D3", "F3", "A3"], duration: "1n" },
                { time: "2:0", notes: ["D3", "F3", "A3"], duration: "2n" },
                { time: "2:2", notes: ["F3", "A3", "C4"], duration: "2n" },
                { time: "3:0", notes: ["G3", "Bb3", "D4"], duration: "2n" },
                { time: "3:2", notes: ["A3", "C#4", "E4"], duration: "2n" },
                { time: "4:0", notes: ["D3", "F3", "A3"], duration: "1n" },
                { time: "5:0", notes: ["D3", "F3", "A3"], duration: "2n" },
                { time: "5:2", notes: ["C3", "E3", "G3"], duration: "2n" },
                { time: "6:0", notes: ["Bb2", "D3", "F3"], duration: "2n" },
                { time: "6:2", notes: ["A2", "C#3", "E3"], duration: "2n" },
                { time: "7:0", notes: ["G2", "Bb2", "D3"], duration: "2n" },
                { time: "7:2", notes: ["A2", "C#3", "E3"], duration: "2n" },
                { time: "8:0", notes: ["D3", "F3", "A3"], duration: "1n" },
            ];

            // Pad - sustained ominous drone
            const padChords = [
                { time: "0:0", notes: ["D2", "A2"], duration: "2n" },
                { time: "1:0", notes: ["D2", "A2"], duration: "2n" },
                { time: "4:0", notes: ["D2", "A2"], duration: "2n" },
                { time: "8:0", notes: ["D2", "A2", "D3"], duration: "1n" },
            ];

            // Schedule melody
            melodyNotes.forEach(n => {
                Tone.Transport.schedule((time) => {
                    leadSynth.triggerAttackRelease(n.note, n.duration, time);
                    noteDisplay.textContent = `♪ ${n.note}`;
                }, n.time);
            });

            // Schedule bass
            bassNotes.forEach(n => {
                Tone.Transport.schedule((time) => {
                    bassSynth.triggerAttackRelease(n.note, n.duration, time);
                }, n.time);
            });

            // Schedule organ chords
            organChords.forEach(n => {
                Tone.Transport.schedule((time) => {
                    organSynth.triggerAttackRelease(n.notes, n.duration, time);
                }, n.time);
            });

            // Schedule pad
            padChords.forEach(n => {
                Tone.Transport.schedule((time) => {
                    padSynth.triggerAttackRelease(n.notes, n.duration, time);
                }, n.time);
            });

            // Stop after the theme ends
            Tone.Transport.schedule(() => {
                stopTheme();
            }, "9:0");

            Tone.Transport.start();
            isPlaying = true;
            playBtn.textContent = "⏹ Stop";
            playBtn.classList.add('playing');
        }

        function stopTheme() {
            Tone.Transport.stop();
            Tone.Transport.cancel();
            synths.forEach(s => {
                try { s.releaseAll(); } catch(e) {}
            });
            isPlaying = false;
            playBtn.textContent = "▶ Play Theme";
            playBtn.classList.remove('playing');
            noteDisplay.textContent = "";
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopTheme();
            } else {
                playLeChuckTheme();
            }
        });
    </script>
</body>
</html>
