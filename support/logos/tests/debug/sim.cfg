# OpenOCD for tb_debug: the simulated GW2A's JTAG through remote_bitbang
adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 9824
transport select jtag
jtag newtap gw2a tap -irlen 8 -expected-id 0x0000081b
target create gw2a.cpu riscv -chain-position gw2a.tap
riscv set_ir dtmcs 0x42
riscv set_ir dmi 0x43
gdb_port 3333
telnet_port disabled
tcl_port disabled
